[build-system]
requires = [
    "setuptools>=77",
    "wheel",
    "cython==3.1.4",
    "numpy==1.26.3",
]
build-backend = "setuptools.build_meta"

[project]
name = "ums-v2v"
version = "0.1.0"
description = "UMS cooperative perception research codebase"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9,<3.10"
dependencies = [
    "addict==2.4.0",
    "cmake==3.25.0",
    "cumm-cu118==0.7.11",
    "cython==3.1.4",
    "easydict==1.13",
    "einops==0.8.1",
    "fire==0.7.1",
    "matplotlib==3.9.4",
    "mmcv==2.0.1",
    "numba==0.60.0",
    "numpy==1.26.3",
    "open3d==0.18.0",
    "ipywidgets>=8.0.4",
    "opencv-python==4.5.1.48",
    "openmim==0.3.9",
    "pandas==2.3.3",
    "pyquaternion==0.9.9",
    "pyyaml==6.0.3",
    "scikit-image==0.19.3",
    "scikit-learn==1.3.2",
    "scipy==1.5.4",
    "seaborn==0.13.2",
    "setuptools==60.2.0",
    "shapely==2.0.0",
    "spconv-cu118==2.3.8",
    "tensorboardX==2.6.4",
    "thop==0.1.1.post2209072238",
    "timm==1.0.20",
    "torch==2.0.1+cu118",
    "torchaudio==2.0.2+cu118",
    "torchvision==0.15.2+cu118",
    "tqdm==4.65.2",
    "wheel==0.45.1",
    "yapf==0.43.0",
]

[tool.setuptools.packages.find]
include = ["opencood*"]

[tool.uv]
cache-dir = ".uv-cache"
package = true
constraint-dependencies = ["setuptools==60.2.0"]
find-links = ["https://download.openmmlab.com/mmcv/dist/cu118/torch2.0/index.html"]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu118" }]
torchaudio = [{ index = "pytorch-cu118" }]
torchvision = [{ index = "pytorch-cu118" }]
